[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# Root: send English browsers to /en/, everyone else to /id/.
[[redirects]]
  from = "/"
  to = "/en/"
  status = 302
  force = false
  conditions = { Language = ["en"] }

[[redirects]]
  from = "/"
  to = "/id/"
  status = 302
  force = false

# Hashed build assets never change: cache them for a year.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
